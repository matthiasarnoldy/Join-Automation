<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join</title>

    <link rel="icon" href="./assets/icons/desktop/logoFavicon.svg" type="image/svg+xml"
        media="(prefers-color-scheme: light)" />
    <link rel="icon" href="./assets/icons/desktop/logo.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)" />

    <script src="./scripts/template.js"></script>
    <script src="./scripts/auth/index.js"></script>
    <script src="./scripts/legalInformation.js"></script>
    <script src="./scripts/global-auth-routing.js"></script>
    <script src="./script.js"></script>

    <link rel="stylesheet" href="./styles/standard.css">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./styles/login/layout.css">
    <link rel="stylesheet" href="./styles/login/forms.css">
    <link rel="stylesheet" href="./styles/login/buttons.css">
    <link rel="stylesheet" href="./styles/login/responsive.css">
    <link rel="stylesheet" href="./styles/welcome.css">
</head>

<body>
    <div class="rotate-lock">Please rotate your device to portrait mode.</div>
    <div class="splash__logo">
        <img src="./assets/icons/desktop/Dark_Logo.svg" alt="Join Logo" class="splash__logo--image">
    </div>
    <div id="main-content" class="main-content">
        <main>
            <div class="welcome__signup">
                <p>Not a Join User?</p>
                <button id="signup-button" class="welcome__button button">Sign Up</button>
            </div>
            <section class="welcome__window">
                <div class="welcome__headline">
                    <div class="welcome__headline--wrapper">
                        <h1>Welcome</h1>
                        <img src="./assets/icons/desktop/welcome__dividingLine.svg" alt="">
                    </div>
                    <p>Pick the option that suits your role: create a request as a stakeholder or log in if you’re part
                        of the team.</p>
                </div>
                <div class="welcome__buttonArea">
                    <div class="welcome__button--wrapper">
                        <div class="welcome__buttonArea--text">
                            <img src="./assets/icons/desktop/welcome__work.svg" alt="">
                            <p>Are you a stakeholder?</p>
                        </div>
                        <a href="./templates/stakeholder.html"
                            class="welcome__buttonLink welcome__buttonLink--stakeholder">Create request</a>
                    </div>
                    <div class="welcome__button--wrapper">
                        <div class="welcome__buttonArea--text">
                            <img src="./assets/icons/desktop/welcome__home.svg" alt="">
                            <p>Are you a team member?</p>
                        </div>
                        <a href="./templates/login.html" class="welcome__buttonLink welcome__buttonLink--member">Member
                            Log in</a>
                    </div>
                </div>
            </section>
        </main>
        <footer class="login__legalInformation--area welcome__legalInformation">
            <a href="./privacy-Policy.html?from=login" class="login__legalInformation" id="index-privacy-policy"
                onclick="return prepareLoginLegalNavigation()">
                Privacy Policy
            </a>
            <a href="./legalnotice.html?from=login" class="login__legalInformation" id="index-legal-notice"
                onclick="return prepareLoginLegalNavigation()">Legal Notice</a>
        </footer>
    </div>
</body>

</html>
